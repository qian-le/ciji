name: Deploy Ciji to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # client_id 可公开；请在仓库 Settings → Secrets and variables → Actions 中配置
          VITE_MAIMEMO_CLIENT_ID: ${{ secrets.VITE_MAIMEMO_CLIENT_ID }}
          VITE_MAIMEMO_ISSUER: ${{ vars.VITE_MAIMEMO_ISSUER || 'https://accounts.maimemo.com/oidc' }}
          VITE_MAIMEMO_SCOPE: ${{ vars.VITE_MAIMEMO_SCOPE || 'openid profile' }}
          # 可选：显式 callback。留空则构建产物在运行时按当前域名推导
          VITE_MAIMEMO_REDIRECT_URI: ${{ vars.VITE_MAIMEMO_REDIRECT_URI || '' }}
          VITE_AI_RELAY_URL: ${{ vars.VITE_AI_RELAY_URL || '' }}
          # 安全：不要把 MiMo API Key 注入公开 Pages 构建。
          # Key 应放在 Cloudflare Worker Secret，或仅保存在用户设备 IndexedDB。
          # VITE_MIMO_API_KEY: 故意留空
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
