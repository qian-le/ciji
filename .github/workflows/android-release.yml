name: Android Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Read version
        id: ver
        run: |
          CODE=$(node -p "require('./version.json').versionCode")
          NAME=$(node -p "require('./version.json').versionName")
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "versionName=$NAME" >> $GITHUB_OUTPUT
          echo "tag=v$NAME" >> $GITHUB_OUTPUT
          node scripts/prepare-release.mjs

      - name: Skip if release exists
        id: should
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists, skip publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web
        if: steps.should.outputs.exists == 'false'
        run: npm run build

      - name: Capacitor sync
        if: steps.should.outputs.exists == 'false'
        run: npx cap sync android

      - name: Decode keystore
        if: steps.should.outputs.exists == 'false' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/ciji-release.jks
          cat > android/keystore/keystore.properties <<EOF
          storeFile=$(pwd)/android/keystore/ciji-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        if: steps.should.outputs.exists == 'false'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Copy APK
        if: steps.should.outputs.exists == 'false'
        run: |
          NAME="${{ steps.ver.outputs.versionName }}"
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "APK not found at $SRC"
            find android/app/build/outputs -name '*.apk' -print
            exit 1
          fi
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/ciji-v${NAME}.apk"
          cp "$SRC" "dist-apk/ciji-v${NAME}-versionCode${{ steps.ver.outputs.versionCode }}.apk"
          # update.json 指向 Release 资产
          node -e "
            const fs=require('fs');
            const v=require('./version.json');
            const u=JSON.parse(fs.readFileSync('update.json','utf8'));
            u.apkUrl='https://github.com/${{ github.repository }}/releases/download/v'+v.versionName+'/ciji-v'+v.versionName+'.apk';
            u.versionCode=v.versionCode; u.versionName=v.versionName; u.changelog=v.changelog||[];
            u.force=!!v.force; u.releasedAt=v.releasedAt||new Date().toISOString();
            fs.writeFileSync('dist-apk/update.json', JSON.stringify(u,null,2)+'\n');
            fs.writeFileSync('update.json', JSON.stringify(u,null,2)+'\n');
          "

      - name: Create GitHub Release
        if: steps.should.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          CODE="${{ steps.ver.outputs.versionCode }}"
          NAME="${{ steps.ver.outputs.versionName }}"
          BODY_FILE=$(mktemp)
          {
            echo "versionCode: ${CODE}"
            echo "versionName: ${NAME}"
            echo ""
            node -e "const v=require('./version.json'); (v.changelog||[]).forEach(c=>console.log('- '+c))"
          } > "$BODY_FILE"
          gh release create "$TAG" \
            "dist-apk/ciji-v${NAME}.apk" \
            "dist-apk/ciji-v${NAME}-versionCode${CODE}.apk" \
            "dist-apk/update.json" \
            --title "词迹 v${NAME}" \
            --notes-file "$BODY_FILE"

      - name: Commit update.json
        if: steps.should.outputs.exists == 'false'
        run: |
          git config user.name "ciji-bot"
          git config user.email "ciji-bot@users.noreply.github.com"
          git add update.json version.json package.json android/app/build.gradle || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${{ steps.ver.outputs.versionName }} (versionCode ${{ steps.ver.outputs.versionCode }})"
            git push
          fi
