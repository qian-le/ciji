<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6c6fe8" />
    <title>词迹 · 墨墨授权中</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #171821;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      .box { text-align: center; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #777b8a; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>正在完成墨墨授权…</h1>
      <p>若长时间未跳转，请返回词迹首页重新登录。</p>
    </div>
    <script>
      (function () {
        var path = window.location.pathname || '/'
        var qs = window.location.search || ''
        // /ciji/auth/callback -> /ciji/
        var appBase = path.replace(/auth\/callback\/?$/i, '')
        if (!appBase.endsWith('/')) appBase += '/'
        var target = appBase + '#/auth/callback' + qs
        window.location.replace(target)
      })()
    </script>
  </body>
</html>
